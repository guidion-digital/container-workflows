on:
  workflow_call:

jobs:
  build-container:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
  
      - name: Build and push
        uses: docker/build-push-action@v7
        id: build-and-push
        with:
          push: false
